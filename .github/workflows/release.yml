name: Release

# Started by the v{version} tag the source repository pushes, right after the commit that
# holds the built tree for that version. Nothing is built here: the commit already holds the
# packages and the shadcn registry, so this publishes exactly what was pushed.
# Pages deploys from pages.yml on the release commit's push to main, because the
# github-pages environment admits main only.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Every package carries the tag version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          for pkg in packages/ui packages/ui-react packages/ui-vue; do
            HAVE=$(jq -r '.version' "$pkg/package.json")
            [ "$HAVE" = "$VERSION" ] || { echo "::error::$pkg is $HAVE, tag is $TAG"; exit 1; }
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Trusted publishing (OIDC) cannot create a package: the first version of a new package
      # is published by hand once, then its Trusted Publisher is set to this workflow file.
      # Failing here, before any publish, keeps a half-published release from happening.
      - name: Preflight, every package already exists on npm
        run: |
          MISSING=""
          for pkg in packages/ui packages/ui-react packages/ui-vue; do
            NAME=$(jq -r '.name' "$pkg/package.json")
            npm view "$NAME" version >/dev/null 2>&1 || MISSING="$MISSING $NAME"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Never published, so OIDC cannot publish it either:$MISSING"
            echo "Publish each package once from a logged-in machine, then on npmjs.com set"
            echo "    Trusted Publisher -> GitHub Actions -> RoxyAPI/ui -> release.yml"
            exit 1
          fi

      # Least-proven package FIRST: a publish cannot be rolled back, so a package whose
      # Trusted Publisher is missing fails before the established ones are touched.
      - name: Publish @roxyapi/ui-vue
        run: |
          npm install -g npm@latest
          (cd packages/ui-vue && npm publish --access public --provenance)

      - name: Publish @roxyapi/ui
        run: (cd packages/ui && npm publish --access public --provenance)

      - name: Publish @roxyapi/ui-react
        run: (cd packages/ui-react && npm publish --access public --provenance)

      - name: Pack npm tarballs for release assets
        run: |
          mkdir -p .release-assets
          for pkg in packages/ui packages/ui-react packages/ui-vue; do
            (cd "$pkg" && npm pack --pack-destination ../../.release-assets)
          done
          ls -la .release-assets

      # The tag already exists; the Release is attached to it.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body: |
            Roxy UI v${{ steps.version.outputs.version }}.

            `@roxyapi/ui`, `@roxyapi/ui-react` and `@roxyapi/ui-vue` are on npm with provenance.

            What changed: https://roxyapi.com/changelog
          make_latest: "true"
          fail_on_unmatched_files: true
          files: .release-assets/*.tgz
