version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Match bunfig.toml minimumReleaseAge (259200s = 3 days). Without this,
    # Dependabot opens PRs for packages younger than bun will install, and CI
    # fails with "blocked by minimum-release-age" until the package ripens.
    cooldown:
      default-days: 3
    groups:
      dev-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-patch:
        dependency-type: production
        update-types:
          - patch
    commit-message:
      prefix: deps
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
