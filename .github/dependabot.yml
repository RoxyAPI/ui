version: 2
updates:
  # bun ecosystem (not npm): the repo lockfile is bun.lock, and npm-ecosystem
  # bumps touch only package.json, so CI's frozen-lockfile install rejects
  # every dependabot PR.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Match bunfig.toml minimumReleaseAge (259200s = 3 days). Without this,
    # Dependabot opens PRs for packages younger than bun will install, and CI
    # fails with "blocked by minimum-release-age" until the package ripens.
    cooldown:
      default-days: 3
    # bun does not support dependency-type grouping, so the prod group names
    # its members (lit is the only runtime dep) and the dev group excludes them.
    groups:
      prod-patch:
        patterns: ["lit"]
        update-types:
          - patch
      dev-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["lit"]
        update-types:
          - minor
          - patch
    ignore:
      # A TypeScript major is gated on hey-api (the type generator), whose peer
      # range is currently >=5.5.3 || >=6.0.0. On TS 7 the generator dies inside
      # the compiler API, so `bun run generate` cannot run. Adopt a TS major by
      # hand once hey-api declares support; a bot cannot land it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
