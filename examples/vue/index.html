<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Roxy UI - Vue example</title>
	<script type="importmap">
		{
			"imports": {
				"vue": "https://esm.sh/vue@3"
			}
		}
	</script>
	<!-- One script tag defines every roxy-* element. -->
	<script
		src="https://cdn.jsdelivr.net/npm/@roxyapi/ui@latest/dist/cdn/roxy-ui.js"
		crossorigin="anonymous"
	></script>
</head>
<body>
	<div id="app"></div>

	<script type="module">
		import { createApp, onMounted, ref } from 'vue';

		const App = {
			setup() {
				const horoscope = ref(null);

				onMounted(async () => {
					// Your backend route holds the secret key, calls RoxyAPI, and
					// returns the response. The key never reaches the browser.
					horoscope.value = await fetch('/api/horoscope?sign=aries').then((r) => r.json());
				});

				return { horoscope };
			},
			template: `
				<main style="max-width: 720px; margin: 0 auto; padding: 32px">
					<h1>Roxy UI in Vue</h1>
					<p>Fetch on your server, pass the response as <code>:data</code>. The key stays server side.</p>
					<roxy-horoscope-card :data="horoscope" period="daily"></roxy-horoscope-card>
				</main>
			`,
		};

		const app = createApp(App);
		app.config.compilerOptions.isCustomElement = (tag) => tag.startsWith('roxy-');
		app.mount('#app');
	</script>
</body>
</html>
