pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "*.{ts,tsx,js,jsx,json}"
      # Skip when only deletions or `.d.ts` files are staged. biome refuses an
      # empty file list with exit 1, which would block deletion-only commits.
      run: |
        staged=$(git diff --name-only --cached --diff-filter=ACMR | grep -E '\.(ts|tsx|js|jsx|json)$' | grep -vE '\.d\.ts$' || true)
        if [ -z "$staged" ]; then exit 0; fi
        bun run check --staged
      stage_fixed: true
    typecheck:
      run: bun run typecheck
    build-and-stage-dist:
      glob: "packages/ui/src/**/*.{ts,css}"
      # Build emits codegen across multiple paths. stage_fixed alone only
      # restages files matching the glob; the build also writes to
      # ui-react/src (codegen wrappers + load-ui), registry/ (shadcn entries),
      # apps/docs/manifest.js (browser mirror). List every artifact path
      # explicitly so the commit captures the full regenerated tree.
      run: |
        bun run build
        git add packages/ui/dist \
                packages/ui-react/dist \
                packages/ui-react/src/components \
                packages/ui-react/src/index.ts \
                packages/ui-react/src/load-ui.ts \
                registry \
                apps/docs/manifest.js

pre-push:
  parallel: false
  commands:
    spec-drift:
      run: |
        bun run generate
        git diff --exit-code -- specs/openapi.json packages/ui/src/types/ \
          || { echo "specs/openapi.json or generated types drifted from live spec. Run 'bun run generate' and commit."; exit 1; }
      priority: 1
    typecheck:
      run: bun run typecheck
      priority: 2
    biome-full:
      run: bun run check
      priority: 3
    brand-grep:
      run: bun run scripts/brand-grep.ts
      priority: 4
    test-unit:
      run: bun run test
      priority: 5
    test-e2e:
      env:
        PLAYWRIGHT_PROJECTS: chromium
      run: bun run test:e2e
      priority: 6
    audit:
      run: |
        bun run build
        bun run preview > /tmp/lefthook-preview.log 2>&1 &
        PREVIEW_PID=$!
        for i in $(seq 1 30); do
          curl -sf http://localhost:3001/ -o /dev/null && break
          sleep 1
        done
        bun run audit
        AUDIT_EXIT=$?
        kill $PREVIEW_PID 2>/dev/null || true
        exit $AUDIT_EXIT
      priority: 7
    docs-drift:
      run: bun run docs:sync && git diff --exit-code -- README.md AGENTS.md || { echo "README.md or AGENTS.md drifted from spec, commit the sync output"; exit 1; }
      priority: 8
