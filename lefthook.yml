pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "*.{ts,tsx,js,jsx,json}"
      run: bun run check --staged
      stage_fixed: true
    typecheck:
      run: bun run typecheck
    build-and-stage-dist:
      glob: "packages/ui/src/**/*.{ts,css}"
      run: bun run build && git add packages/ui/dist packages/ui-react/dist
      stage_fixed: true

pre-push:
  parallel: false
  commands:
    spec-drift:
      run: |
        bun run generate
        git diff --exit-code -- specs/openapi.json packages/ui/src/types/ \
          || { echo "specs/openapi.json or generated types drifted from live spec. Run 'bun run generate' and commit."; exit 1; }
      priority: 1
    typecheck:
      run: bun run typecheck
      priority: 2
    biome-full:
      run: bun run check
      priority: 3
    test-unit:
      run: bun run test
      priority: 4
    test-e2e:
      env:
        PLAYWRIGHT_PROJECTS: chromium
      run: bun run test:e2e
      priority: 5
    audit:
      run: |
        bun run build
        bun run preview > /tmp/lefthook-preview.log 2>&1 &
        PREVIEW_PID=$!
        for i in $(seq 1 30); do
          curl -sf http://localhost:3001/ -o /dev/null && break
          sleep 1
        done
        bun run audit
        AUDIT_EXIT=$?
        kill $PREVIEW_PID 2>/dev/null || true
        exit $AUDIT_EXIT
      priority: 6
    docs-drift:
      run: bun run docs:sync && git diff --exit-code -- README.md AGENTS.md || { echo "README.md or AGENTS.md drifted from spec, commit the sync output"; exit 1; }
      priority: 7
