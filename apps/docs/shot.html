<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex, nofollow">
	<title>RoxyAPI UI preview stages (internal capture page)</title>

	<!-- Same two families the practitioner theme self-hosts (Fraunces display +
	     Jost body), loaded straight from Google Fonts here since this internal
	     capture page carries no CSP restriction. Linked so document.fonts.ready
	     gates the capture. -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Jost:wght@400..600&display=swap">

	<link rel="stylesheet" href="./dist/styles/tokens.css">
	<style>
		* { box-sizing: border-box; }

		body {
			margin: 0;
			background: var(--roxy-bg);
			font-family: "Jost", system-ui, sans-serif;
		}

		/* Stages stack vertically; each is captured on its own so page flow only
		 * needs to keep them from clipping one another. */
		#stages {
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			gap: 24px;
			padding: 24px;
		}

		/* The capture unit: exactly 600x400 CSS px, so a 2x device pixel ratio
		 * screenshot lands at 1200x800 by construction. overflow:hidden makes the
		 * top-anchored component bleed off the bottom edge as an intentional crop. */
		.stage {
			position: relative;
			width: 600px;
			height: 400px;
			overflow: hidden;
			display: flex;
			flex-direction: column;
			/* Near-surface field with a very soft per-domain accent tint. The base is
			 * --roxy-bg so dark theme renders the same stage under dark tokens; the
			 * accent hexes are the shipped per-domain presets (see shot.js). */
			background:
				color-mix(in srgb, var(--stage-accent-light) 7%, var(--roxy-bg));
		}
		:root[data-theme="dark"] .stage {
			background:
				color-mix(in srgb, var(--stage-accent-dark) 13%, var(--roxy-bg));
		}

		.stage-head {
			flex: 0 0 auto;
			padding: 30px 34px 0;
		}
		.stage-heading {
			margin: 0;
			font-family: "Fraunces", ui-serif, Georgia, serif;
			font-optical-sizing: auto;
			font-size: 28px;
			font-weight: 560;
			line-height: 1.12;
			letter-spacing: -0.01em;
			color: var(--roxy-fg);
		}
		.stage-sub {
			margin: 9px 0 0;
			font-family: "Jost", system-ui, sans-serif;
			font-size: 13.5px;
			font-weight: 400;
			line-height: 1.45;
			color: var(--roxy-muted);
			/* Clamp to two lines so a long docsSummary never pushes the render down. */
			display: -webkit-box;
			-webkit-box-orient: vertical;
			-webkit-line-clamp: 2;
			line-clamp: 2;
			overflow: hidden;
			max-width: 44ch;
		}
		.stage-tag {
			display: inline-block;
			margin-top: 13px;
			padding: 3px 9px;
			border-radius: 6px;
			font-family: var(--roxy-font-mono, ui-monospace, "SF Mono", Menlo, monospace);
			font-size: 11.5px;
			line-height: 1.4;
			color: var(--roxy-accent-ink);
			background: color-mix(in srgb, var(--stage-accent-light) 15%, transparent);
			border: 1px solid color-mix(in srgb, var(--stage-accent-light) 32%, transparent);
		}
		:root[data-theme="dark"] .stage-tag {
			background: color-mix(in srgb, var(--stage-accent-dark) 17%, transparent);
			border-color: color-mix(in srgb, var(--stage-accent-dark) 34%, transparent);
		}

		/* The render region. min-height:0 lets it shrink inside the flex column so
		 * the component overflows past the stage bottom (clipped by .stage) rather
		 * than forcing the stage taller. overflow is visible here; the stage clips. */
		.stage-body {
			flex: 1 1 auto;
			min-height: 0;
			margin-top: 18px;
			padding: 0 34px;
			overflow: visible;
		}
		.stage-mount {
			width: 100%;
			transform: scale(var(--body-scale, 1));
			transform-origin: top center;
		}
		.stage-mount > * {
			display: block;
			width: 100%;
		}
	</style>
</head>
<body>
	<div id="stages"></div>

	<!-- Order mirrors index.html: the UMD registers the elements, the two manifest
	     globals feed shot.js, shot.js builds the stages, then the deferred
	     sample-data.js module runs last and wires .data onto each element by id. -->
	<script src="./dist/cdn/roxy-ui.js"></script>
	<script src="./manifest.js"></script>
	<script src="./components-manifest.js"></script>
	<script src="./shot.js"></script>
	<script type="module" src="./sample-data.js"></script>
</body>
</html>
